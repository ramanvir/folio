<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Folio — Markdown Reader</title>
  <meta name="description" content="A local markdown reader with beautiful typography. Your files never leave your machine.">
  <meta name="theme-color" content="#faf9f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1b1a" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <button id="sidebar-toggle" class="icon-btn" aria-label="Toggle sidebar (Ctrl+B)" title="Toggle sidebar (⌘B)">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="9" y1="4" x2="9" y2="20"/></svg>
    </button>
    <span class="app-name">Folio</span>
    <span id="current-file-name" class="file-name"></span>
    <span class="spacer"></span>
    <button id="open-folder-btn" class="text-btn" title="Open folder (⌘O)">Open folder</button>
    <button id="theme-toggle" class="icon-btn" aria-label="Toggle theme" title="Toggle theme">
      <svg class="sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <div class="layout">
    <nav id="sidebar" class="sidebar" aria-label="Files">
      <div id="file-tree" class="file-tree"></div>
    </nav>

    <main id="main" class="main">
      <section id="welcome" class="welcome">
        <div class="welcome-inner">
          <div class="welcome-mark" aria-hidden="true">F</div>
          <h1>Folio</h1>
          <p class="welcome-sub">A quiet place to read your markdown.<br>Everything stays on your machine.</p>
          <button id="welcome-open-btn" class="cta">Open a folder</button>
          <p class="welcome-hint">…or drop a <code>.md</code> file anywhere on this window.<br><kbd>⌘O</kbd> open folder&ensp;·&ensp;<kbd>⌘B</kbd> toggle sidebar</p>
        </div>
      </section>
      <article id="content" class="content prose" hidden></article>
    </main>

    <aside id="outline" class="outline" hidden aria-label="Table of contents">
      <div class="outline-title">Contents</div>
      <nav id="toc"></nav>
    </aside>
  </div>

  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <div id="drop-veil" class="drop-veil" hidden><div>Drop to open</div></div>

  <input type="file" id="dir-fallback-input" webkitdirectory multiple hidden>
  <input type="file" id="file-fallback-input" accept=".md,.markdown,text/markdown" hidden>

  <script src="./vendor/marked.min.js"></script>
  <script src="./vendor/purify.min.js"></script>
  <script src="./vendor/highlight.min.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
