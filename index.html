<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Folio — Markdown Reader</title>
  <meta name="description" content="A lightweight, open-source, mobile-friendly markdown reader to consume knowledge created by AI agents. All documents remain local — always.">
  <meta name="theme-color" content="#faf9f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1b1a" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Folio">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Folio">
  <meta property="og:title" content="Folio — Markdown Reader">
  <meta property="og:description" content="A lightweight, open-source, mobile-friendly markdown reader to consume knowledge created by AI agents. All documents remain local — always.">
  <meta property="og:url" content="https://ramanvir.github.io/folio/">
  <meta property="og:image" content="https://ramanvir.github.io/folio/icons/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Folio — Markdown Reader">
  <meta name="twitter:description" content="A lightweight, open-source, mobile-friendly markdown reader to consume knowledge created by AI agents. All documents remain local — always.">
  <meta name="twitter:image" content="https://ramanvir.github.io/folio/icons/og-image.png">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./favicon.ico" sizes="48x48">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="./icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <button id="sidebar-toggle" class="icon-btn" aria-label="Toggle sidebar (Ctrl+B)" title="Toggle sidebar (⌘B)">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="9" y1="4" x2="9" y2="20"/></svg>
    </button>
    <span id="current-file-name" class="file-name"></span>
    <span class="spacer"></span>
    <button id="outline-toggle" class="icon-btn" aria-label="Toggle contents panel" title="Toggle contents panel">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="15" y1="4" x2="15" y2="20"/></svg>
    </button>
    <div class="menu-wrap">
      <button id="menu-toggle" class="icon-btn" aria-label="Menu" aria-haspopup="true" aria-expanded="false" title="Menu">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg>
      </button>
      <div id="app-menu" class="menu" hidden>
        <button id="open-file-btn" class="menu-item" title="Open file (⇧⌘O)">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
          Open file
        </button>
        <button id="open-folder-btn" class="menu-item" title="Open folder (⌘O)">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          Open folder
        </button>
        <div class="menu-sep"></div>
        <div class="menu-size">
          <span>Text size</span>
          <span class="menu-size-btns">
            <button id="font-dec" class="icon-btn font-btn" aria-label="Decrease text size" title="Smaller text">A−</button>
            <button id="font-inc" class="icon-btn font-btn" aria-label="Increase text size" title="Larger text">A+</button>
          </span>
        </div>
        <div class="menu-sep"></div>
        <button id="reader-toggle" class="menu-item" aria-pressed="false" title="Reader mode (Esc to exit)">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/></svg>
          Reader mode
        </button>
        <button id="eink-toggle" class="menu-item" aria-pressed="false" title="E-ink mode">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="9" y1="7" x2="15" y2="7"/><line x1="9" y1="11" x2="15" y2="11"/><line x1="9" y1="15" x2="13" y2="15"/></svg>
          E-ink mode
        </button>
        <button id="theme-toggle" class="menu-item" title="Toggle theme">
          <svg class="sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          Switch theme
        </button>
      </div>
    </div>
  </header>

  <div class="layout">
    <nav id="sidebar" class="sidebar" aria-label="Files">
      <div id="file-tree" class="file-tree"></div>
    </nav>

    <main id="main" class="main">
      <section id="welcome" class="welcome">
        <div class="welcome-inner">
          <div class="welcome-mark" aria-hidden="true">F</div>
          <h1>Folio</h1>
          <p class="welcome-sub">A lightweight, open-source markdown reader to consume knowledge created by AI agents.<br>Mobile friendly — and all documents remain local, always.</p>
          <button id="welcome-open-btn" class="cta">Open a folder</button>
          <button id="welcome-open-file-btn" class="cta-secondary">…or open a single file</button>
          <p class="welcome-hint">You can also drop a <code>.md</code> file anywhere on this window.<br><kbd>⌘O</kbd> open folder&ensp;·&ensp;<kbd>⇧⌘O</kbd> open file&ensp;·&ensp;<kbd>⌘B</kbd> toggle sidebar</p>
        </div>
      </section>
      <article id="content" class="content prose" hidden></article>
    </main>

    <aside id="outline" class="outline" hidden aria-label="Table of contents">
      <div class="outline-title">Contents</div>
      <nav id="toc"></nav>
    </aside>
  </div>

  <div id="progress" class="progress" hidden aria-hidden="true"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <div id="drop-veil" class="drop-veil" hidden><div>Drop to open</div></div>

  <input type="file" id="dir-fallback-input" webkitdirectory multiple hidden>
  <input type="file" id="file-fallback-input" accept=".md,.markdown,text/markdown" hidden>

  <script src="./vendor/marked.min.js"></script>
  <script src="./vendor/purify.min.js"></script>
  <script src="./vendor/highlight.min.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
